name: 競輪データ自動収集

on:
 workflow_dispatch:
    inputs:
      force_year:
        description: '強制指定する年（例: 2024）。空白なら自動判断'
        required: false
        default: ''
      force_month:
        description: '強制指定する月（例: 3）。空白なら自動判断'
        required: false
        default: ''

permissions:
  contents: write   # git push に必要

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリインストール
        run: pip install -r requirements.txt

      - name: スクレイピング実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FORCE_YEAR: ${{ github.event.inputs.force_year }}
          FORCE_MONTH: ${{ github.event.inputs.force_month }}
        run: python scripts/auto_runner.py

      - name: CSVをGitにコミット＆プッシュ
        if: success()
        id: git_push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keirin_data/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "変更なし。スキップします。"
          else
            TODAY=$(date '+%Y-%m-%d %H:%M')
            git commit -m "🚴 競輪データ自動更新 ${TODAY}"
            # 並列実行時の競合対策: pull --rebase してからpush（最大5回リトライ）
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "Push失敗 (試行${i}/5)、10秒後リトライ..."
              sleep 10
            done
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
